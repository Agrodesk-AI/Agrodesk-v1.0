services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agrodesk
      POSTGRES_PASSWORD: agrodesk
      POSTGRES_DB: agrodesk
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrodesk"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
